# docker-compose.yml

x-app-environment: &app-environment
  WWWUSER: '${WWWUSER}'
  WWWGROUP: '${WWWGROUP:-1000}'
  LARAVEL_SAIL: 1
  XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
  XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
  IGNITION_LOCAL_SITES_PATH: '${PWD}'

services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.4/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
    environment:
      <<: *app-environment
    volumes:
      - '.:/var/www/html'
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    networks:
      - sail
    depends_on:
      - mysql
      - redis

  # ===== SCHEDULER =====
  scheduler:
    image: sail-8.4/app
    command: "php artisan schedule:work"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 60s

  # ===== WORKER DEDICADO: CLT ONLINE =====
  queue-clt-on:
    image: sail-8.4/app
    command: "php artisan queue:work --queue=${CLT_ON_JOB_QUEUE:-clt-on} --sleep=1 --verbose --timeout=${CLT_ON_JOB_TIMEOUT:-18000} --tries=1 --backoff=60 --memory=1024"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 120s

  # ===== WORKER DEDICADO: CLT OFFLINE =====
  queue-clt-off:
    image: sail-8.4/app
    command: "php artisan queue:work --queue=${CLT_OFF_JOB_QUEUE:-clt-off} --sleep=1 --verbose --timeout=${CLT_OFF_JOB_TIMEOUT:-18000} --tries=1 --backoff=60 --memory=1024"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 120s

  # ===== WORKER DEDICADO: FGTS OFF (consultas) =====
  queue-fgts:
    image: sail-8.4/app
    command: "php artisan queue:work --queue=${FGTS_OFF_JOB_QUEUE:-fgts} --sleep=1 --verbose --timeout=${FGTS_OFF_JOB_TIMEOUT:-18000} --tries=1 --backoff=60 --memory=1024"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 120s

  # ===== WORKER DEDICADO: RELATÓRIOS / PRÉVIAS =====
  queue-reports:
    image: sail-8.4/app
    command: "php artisan queue:work --queue=${CLT_PREVIEW_QUEUE:-reports} --sleep=1 --verbose --timeout=7200 --tries=1 --backoff=30 --memory=1024"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 120s

  # ==========================================================
  # ✅ WORKER UNIFICADO: URA + C6 (prioridade para URA)
  # - 1 processo, 1 job por vez
  # - URA sempre ganha (fila "ura" vem primeiro)
  # ==========================================================
  queue-ura-c6:
    image: sail-8.4/app
    command: "php artisan queue:work --queue=${URA_JOB_QUEUE:-ura},${C6_JOB_QUEUE:-c6-auth} --sleep=1 --verbose --timeout=120 --tries=3 --backoff=10 --memory=1024"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 120s

  # ===== WORKER GENÉRICO (opcional) =====
  queue-default:
    image: sail-8.4/app
    command: "php artisan queue:work --queue=default --sleep=1 --verbose --timeout=18000 --tries=3 --backoff=60 --memory=1024"
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    stop_grace_period: 120s

  # ===== SERVIÇO FRONTEND =====
  frontend:
    build:
      context: ../lead-import-visualizer
      dockerfile: Dockerfile
    image: catarinense-frontend
    container_name: catarinense-frontend-app
    ports:
      - "8080:8080"
    volumes:
      - ../lead-import-visualizer:/app
      - /app/node_modules
    networks:
      - sail
    depends_on:
      - laravel.test

  # ===== SERVIÇO MYSQL =====
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  # ===== SERVIÇO REDIS =====
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
  redis-data:
    driver: local
