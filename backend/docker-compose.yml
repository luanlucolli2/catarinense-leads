# docker-compose.yml (DEV SIMULANDO PROD)
version: '3'

x-app-environment: &app-environment
  WWWUSER: '${WWWUSER}'
  WWWGROUP: '${WWWGROUP:-1000}'
  LARAVEL_SAIL: 1
  XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
  XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
  IGNITION_LOCAL_SITES_PATH: '${PWD}'
  # Variáveis Default (Fallback)
  CLT_ON_JOB_QUEUE: 'clt-on'
  CLT_OFF_JOB_QUEUE: 'clt-off'
  FGTS_OFF_JOB_QUEUE: 'fgts'
  CLT_PREVIEW_QUEUE: 'reports'
  URA_JOB_QUEUE: 'ura'
  C6_JOB_QUEUE: 'c6-auth'
  CLT_ON_JOB_TIMEOUT: '18000'
  CLT_OFF_JOB_TIMEOUT: '18000'
  FGTS_OFF_JOB_TIMEOUT: '18000'

services:
  # ===== SERVIÇO APP (HTTP / API) =====
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.4/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
    environment:
      <<: *app-environment
    volumes:
      - '.:/var/www/html'
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    networks:
      - sail
    depends_on:
      - mysql
      - redis
    # Limitando para simular prod (mas deixando um pouco menos que prod para sobrar pra workers)
    mem_limit: 384m 

  # ==========================================================
  # ✅ WORKER UNIFICADO (SUPERVISOR)
  # ==========================================================
  leads-workers:
    image: sail-8.4/app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update && apt-get install -y supervisor
        supervisord -c /etc/supervisor/conf.d/supervisord.conf
    environment:
      <<: *app-environment
    volumes:
      - '.:/var/www/html'
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    depends_on:
      - mysql
      - redis
    networks:
      - sail
    restart: unless-stopped
    # ⚠️ AQUI ESTÁ O GARGALO PROPOSITAL
    # Prod soma > 3GB em limites teóricos. VPS tem 2GB.
    # Travando container em ~900MB. Se todos workers subirem memória ao mesmo tempo,
    # o OOM Killer do Linux vai matar esse container. É o teste de stress real.
    mem_limit: 900m

  # ===== SERVIÇO FRONTEND =====
  frontend:
    build:
      context: ../lead-import-visualizer
      dockerfile: Dockerfile
    image: catarinense-frontend
    container_name: catarinense-frontend-app
    ports:
      - "8080:8080"
    volumes:
      - ../lead-import-visualizer:/app
      - /app/node_modules
    networks:
      - sail
    depends_on:
      - laravel.test
    mem_limit: 64m

  # ===== SERVIÇO MYSQL =====
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    # Adicionado flag para desligar performance schema igual Prod
    command: --performance-schema=0
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
    mem_limit: 512m

  # ===== SERVIÇO REDIS =====
  redis:
    image: redis:7-alpine
    # Igual Prod: maxmemory policy
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
  redis-data:
    driver: local