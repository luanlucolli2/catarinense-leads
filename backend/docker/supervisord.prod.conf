[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# ===== IMPORTS & DEFAULT =====
[program:imports-default]
command=php -d memory_limit=640M /var/www/html/artisan queue:work --queue=imports,default --sleep=1 --tries=3 --backoff=60 --memory=576 --timeout=18000
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-default.log

# ===== CLT CONSULTA ONLINE =====
[program:clt-consulta-online]
command=php -d memory_limit=384M /var/www/html/artisan queue:work --queue=%(ENV_CLT_ON_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=320 --timeout=%(ENV_CLT_ON_JOB_TIMEOUT)s
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-clt-consulta-online.log

# ===== CLT VALIDA POLITICA CRED =====
[program:clt-valida-politica-cred]
command=php -d memory_limit=416M /var/www/html/artisan queue:work --queue=%(ENV_CLT_PHASE2_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=352 --timeout=%(ENV_CLT_PHASE2_JOB_TIMEOUT)s
