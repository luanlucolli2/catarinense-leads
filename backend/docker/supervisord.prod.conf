[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# ===== IMPORTS & DEFAULT (Antigo "queue default") =====
# Reduzido de 896MB para 768MB para ceder RAM ao V8
[program:imports-default]
command=php -d memory_limit=832M /var/www/html/artisan queue:work --queue=imports,default --sleep=1 --tries=3 --backoff=60 --memory=768 --timeout=18000
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-default.log

# ===== CLT ONLINE =====
# Mantido 640MB
[program:clt-on]
command=php -d memory_limit=704M /var/www/html/artisan queue:work --queue=%(ENV_CLT_ON_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=640 --timeout=%(ENV_CLT_ON_JOB_TIMEOUT)s
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-clt-on.log

# ===== CLT OFFLINE =====
# Mantido 512MB
[program:clt-off]
command=php -d memory_limit=576M /var/www/html/artisan queue:work --queue=%(ENV_CLT_OFF_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=512 --timeout=%(ENV_CLT_OFF_JOB_TIMEOUT)s
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-clt-off.log

# ===== FGTS OFF =====
# Reduzido de 448MB para 384MB para ceder RAM ao V8
[program:fgts]
command=php -d memory_limit=432M /var/www/html/artisan queue:work --queue=%(ENV_FGTS_OFF_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=384 --timeout=%(ENV_FGTS_OFF_JOB_TIMEOUT)s
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-fgts.log

# ===== V8 (PRIORIDADE AUMENTADA) =====
# Aumentado de 448MB para 640MB (Pegou a sobra do FGTS e Default)
[program:v8]
command=php -d memory_limit=704M /var/www/html/artisan queue:work --queue=%(ENV_V8_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=640 --timeout=%(ENV_V8_JOB_TIMEOUT)s
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-v8.log

# ===== REPORTS / PREVIEW =====
# Mantido 320MB
[program:reports]
command=php -d memory_limit=352M /var/www/html/artisan queue:work --queue=%(ENV_CLT_PREVIEW_QUEUE)s --sleep=1 --tries=1 --backoff=30 --memory=320 --timeout=7200
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-reports.log

# ===== SCHEDULER (CRON) =====
# Incorporado ao container de workers
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
