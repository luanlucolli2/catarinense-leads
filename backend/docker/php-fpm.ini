; =============================================================
; RECURSOS & LIMITES
; =============================================================
; Mantive seus limites altos para relatórios/uploads.
; CUIDADO: Com 2GB de RAM total, se 3 ou 4 requisições pesadas
; baterem 480M ao mesmo tempo, seu servidor pode travar (OOM).
max_execution_time = 600
max_input_time = 600
memory_limit = 480M
upload_max_filesize = 256M
post_max_size = 256M

; =============================================================
; OPCACHE (OTIMIZADO PARA PRODUÇÃO / PERFORMANCE)
; =============================================================
opcache.enable=1

; Desabilita OPcache na CLI (artisan/workers) para economizar RAM
; já que os workers rodam em long-running process e não se beneficiam tanto
opcache.enable_cli=0

; Memória reservada para o cache do código compilado.
; 64MB é "apertado" para Laravel moderno, mas necessário para seu server de 2GB.
opcache.memory_consumption=64

; Quantidade de strings internadas (nomes de classes/métodos)
opcache.interned_strings_buffer=16

; Máximo de arquivos no cache (Laravel + Vendor tem muitos arquivos)
opcache.max_accelerated_files=10000

; --- A MUDANÇA CRUCIAL PARA PERFORMANCE ---
; 0 = Nunca checar o disco. O PHP confia 100% na memória.
; Isso reduz drasticamente o uso de CPU/IO.
opcache.validate_timestamps=0

; Ignorado quando validate_timestamps=0, mas deixamos 0 por garantia.
opcache.revalidate_freq=0

; JIT desativado (JIT consome RAM extra e o ganho em Web App é marginal)
opcache.jit=0
opcache.jit_buffer_size=0

; =============================================================
; CACHE DE CAMINHOS DE ARQUIVO (Realpath)
; =============================================================
; O Laravel acessa muitos arquivos. Isso ajuda o PHP a lembrar onde eles estão.
realpath_cache_size=4096k
realpath_cache_ttl=600

; =============================================================
; SEGURANÇA
; =============================================================
expose_php=0