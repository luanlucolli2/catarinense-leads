[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# ===== IMPORTS & DEFAULT (Antigo "queue default" - Maior Prioridade/Memória) =====
# Prod: 1024MB | Aqui: 896MB (Deixei alto pois imports de CSV costumam gastar muito)
[program:imports-default]
command=php /var/www/html/artisan queue:work --queue=imports,default --sleep=1 --tries=3 --backoff=60 --memory=896 --timeout=18000
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-default.log

# ===== CLT ONLINE (2ª Maior carga) =====
# Prod: 704MB | Aqui: 640MB
[program:clt-on]
command=php /var/www/html/artisan queue:work --queue=%(ENV_CLT_ON_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=640 --timeout=%(ENV_CLT_ON_JOB_TIMEOUT)s
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-clt-on.log

# ===== CLT OFFLINE =====
# Prod: 560MB | Aqui: 512MB
[program:clt-off]
command=php /var/www/html/artisan queue:work --queue=%(ENV_CLT_OFF_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=512 --timeout=%(ENV_CLT_OFF_JOB_TIMEOUT)s
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-clt-off.log

# ===== FGTS OFF =====
# Prod: 472MB | Aqui: 448MB
[program:fgts]
command=php /var/www/html/artisan queue:work --queue=%(ENV_FGTS_OFF_JOB_QUEUE)s --sleep=1 --tries=1 --backoff=60 --memory=448 --timeout=%(ENV_FGTS_OFF_JOB_TIMEOUT)s
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-fgts.log

# ===== REPORTS / PREVIEW (Menor carga de processamento pesado) =====
# Prod: 384MB | Aqui: 320MB
[program:reports]
command=php /var/www/html/artisan queue:work --queue=%(ENV_CLT_PREVIEW_QUEUE)s --sleep=1 --tries=1 --backoff=30 --memory=320 --timeout=7200
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-reports.log

# ===== URA + C6 (Processos leves de API) =====
# Novo unificado | Aqui: 192MB (Suficiente para chamadas HTTP)
[program:ura-c6]
command=php /var/www/html/artisan queue:work --queue=%(ENV_URA_JOB_QUEUE)s,%(ENV_C6_JOB_QUEUE)s --sleep=1 --tries=3 --backoff=10 --memory=192 --timeout=120
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-ura.log

# ===== SCHEDULER =====
# Prod: 192MB | Aqui: 128MB (Scheduler só dispara eventos, gasta pouco)
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log