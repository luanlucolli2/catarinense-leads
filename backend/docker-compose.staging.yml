# docker-compose.staging.yml
version: "3.9"

x-app-env: &app-env
  APP_ENV: production
  WWWUSER: "1000"
  APP_DEBUG: "false"

services:
  mysql:
    image: mysql:8.0
    container_name: leads-mysql
    restart: unless-stopped
    volumes:
      - sail-mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 10s
    networks: [sail]

  laravel:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    image: leads-backend
    container_name: leads-backend
    env_file: .env.staging
    environment:
      APP_ENV: production
      WWWUSER: "1000"
      APP_DEBUG: "false"
    volumes:
      - .:/var/www/html
      # ➕ aplicar php.ini também na CLI
      - ./docker/php.ini:/etc/php/8.4/cli/conf.d/99-custom.ini
      # (mantido; se fpm existir no runtime, também pega)
      - ./docker/php.ini:/etc/php/8.4/fpm/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql]
    networks: [sail]
    restart: unless-stopped


  # Worker genérico (mantido)
  queue:
    image: leads-backend
    container_name: leads-queue
    command: php artisan queue:work --queue=default --sleep=1 --verbose --timeout=115200 --memory=512 --tries=3
    env_file: .env.staging
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
    depends_on: [mysql]
    networks: [sail]
    restart: unless-stopped

  # Worker dedicado para a fila CLT
  queue-clt:
    image: leads-backend
    container_name: leads-queue-clt
    command: php artisan queue:work --queue=${CLT_JOB_QUEUE:-clt} --sleep=1 --verbose --timeout=${CLT_JOB_TIMEOUT:-115200} --memory=512 --tries=1
    env_file: .env.staging
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
    depends_on: [mysql]
    networks: [sail]
    restart: unless-stopped
    stop_grace_period: 120s

  # Worker dedicado para a fila FGTS OFF
  queue-fgts:
    image: leads-backend
    container_name: leads-queue-fgts
    command: php artisan queue:work --queue=${FGTS_OFF_JOB_QUEUE:-fgts} --sleep=1 --verbose --timeout=${FGTS_OFF_JOB_TIMEOUT:-115200} --memory=512 --tries=1
    env_file: .env.staging
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
    depends_on: [mysql]
    networks: [sail]
    restart: unless-stopped
    stop_grace_period: 120s

  frontend:
    build:
      context: ../lead-import-visualizer
      dockerfile: Dockerfile
    image: leads-frontend
    container_name: leads-frontend
    ports:
      - "8080:80"
    networks: [sail]
    depends_on: [laravel]

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
  storage-data:
