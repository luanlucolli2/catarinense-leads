version: "3.9"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"

services:
  # ===== DATABASE =====
  mysql:
    image: mysql:8.0
    container_name: leads-mysql
    restart: unless-stopped
    volumes:
      - sail-mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 10s
    networks: [sail]
    mem_limit: 512m
    # cpu_shares removido ou mantido conforme preferência, mas mem_limit é o crucial aqui

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: leads-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    networks: [sail]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m

  # ===== APP (LARAVEL API) =====
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: leads-backend
    container_name: leads-backend
    restart: unless-stopped
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      # O código NÃO é mais montado aqui. Apenas configurações e dados persistentes.
      - ./backend/docker/php-fpm.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    networks: [sail]
    mem_limit: 512m

  # ===== SCHEDULER =====
  scheduler:
    image: leads-backend
    container_name: leads-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      - ./backend/docker/php-cli.scheduler.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    mem_limit: 192m

  # ===== QUEUE DEFAULT =====
  queue:
    image: leads-backend
    container_name: leads-queue
    restart: unless-stopped
    command: php artisan queue:work --queue=default --sleep=1 --verbose --timeout=259200 --memory=896 --tries=3 --backoff=60
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      - ./backend/docker/php-cli.default.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    stop_grace_period: 120s
    mem_limit: 1024m

  # ===== CLT ONLINE =====
  queue-clt-on:
    image: leads-backend
    container_name: leads-queue-clt-on
    restart: unless-stopped
    command: php artisan queue:work --queue=${CLT_ON_JOB_QUEUE:-clt-on} --sleep=1 --verbose --timeout=${CLT_JOB_TIMEOUT:-259200} --memory=640 --tries=1 --backoff=60
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      - ./backend/docker/php-cli.clt-on.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    stop_grace_period: 120s
    mem_limit: 704m

  # ===== CLT OFFLINE =====
  queue-clt-off:
    image: leads-backend
    container_name: leads-queue-clt-off
    restart: unless-stopped
    command: php artisan queue:work --queue=${CLT_OFF_JOB_QUEUE:-clt-off} --sleep=1 --verbose --timeout=${CLT_JOB_TIMEOUT:-259200} --memory=512 --tries=1 --backoff=60
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      - ./backend/docker/php-cli.clt-off.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    stop_grace_period: 120s
    mem_limit: 560m

  # ===== FGTS OFF =====
  queue-fgts:
    image: leads-backend
    container_name: leads-queue-fgts
    restart: unless-stopped
    command: php artisan queue:work --queue=${FGTS_OFF_JOB_QUEUE:-fgts} --sleep=1 --verbose --timeout=${FGTS_OFF_JOB_TIMEOUT:-115200} --memory=440 --tries=3 --backoff=60
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      - ./backend/docker/php-cli.fgts.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    stop_grace_period: 120s
    mem_limit: 472m

  # ===== RELATÓRIOS/PRÉVIAS =====
  queue-reports:
    image: leads-backend
    container_name: leads-queue-reports
    restart: unless-stopped
    command: php artisan queue:work --queue=${CLT_PREVIEW_QUEUE:-reports} --sleep=1 --verbose --timeout=7200 --memory=360 --tries=3 --backoff=30
    env_file: ./backend/.env.staging
    environment: { <<: *app-env }
    volumes:
      - ./backend/docker/php-cli.reports.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on: [mysql, redis]
    stop_grace_period: 120s
    mem_limit: 384m

  # ===== FRONTEND (NGINX + REACT) =====
  frontend:
    build:
      context: ./lead-import-visualizer
      dockerfile: Dockerfile
    image: leads-frontend
    container_name: leads-frontend
    ports: ["8080:80"]
    networks: [sail]
    depends_on: [laravel]
    mem_limit: 64m

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
  storage-data:
  redis-data: