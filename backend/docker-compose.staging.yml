# version: "3.9"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"

services:
  # ===== DATABASE =====
  mysql:
    image: mysql:8.0
    container_name: leads-mysql
    restart: unless-stopped
    command: --performance-schema=0
    volumes:
      - sail-mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 10s
    networks: [sail]
    mem_limit: 512m

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: leads-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    networks: [sail]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m

  # ===== APP (LARAVEL API - HTTP ONLY) =====
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: leads-backend
    container_name: leads-backend
    restart: unless-stopped
    env_file: .env.staging
    environment: { <<: *app-env }
    volumes:
      - ./docker/php-fpm.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sail]
    # Limite para o servidor web (PHP-FPM)
    mem_limit: 512m

  # ===== WORKER UNIFICADO (SUPERVISOR) =====
  # Substitui: queue, facta-clt-on, facta-clt-off, fgts, reports, scheduler
  leads-workers:
    image: leads-backend # Usa a mesma imagem do laravel, pois o código é o mesmo
    container_name: leads-workers
    restart: unless-stopped
    env_file: .env.staging
    environment: { <<: *app-env }
    # Sobrescreve o CMD padrão para rodar o Supervisor
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - storage-data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sail]
    # Limite GLOBAL do container.
    # PHP Limits somados (teórico): 768+640+512+384+640+320 = ~3.2GB
    # Realidade: Eles não batem pico juntos.
    # Limite Hard do Container: 1024m (1GB).
    # Se estourar 1GB, o OOM Killer reinicia o container (auto-healing).
    mem_limit: 1024m

  # ===== FRONTEND (NGINX + REACT) =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: leads-frontend
    container_name: leads-frontend
    ports: ["8080:80"]
    networks: [sail]
    depends_on: [laravel]
    mem_limit: 64m

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
  storage-data:
  redis-data:
