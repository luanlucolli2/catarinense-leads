server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads e Timeouts
    client_max_body_size 200m;
    client_body_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 65s;

    # 1. Single Page App (React)
    location / {
        try_files $uri /index.html;
    }

    # 2. API e Sanctum -> Enviando para o PHP-FPM (Laravel)
    # Agrupamos /api e /sanctum na mesma regra regex
    location ~ ^/(api|sanctum)/ {
        # O truque está aqui: Nginx fala FastCGI, não HTTP
        fastcgi_pass laravel:9000;
        
        include fastcgi_params;
        
        # Dizemos ao PHP exatamente qual arquivo executar dentro do container DELE
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        
        # Passamos a query string
        fastcgi_param QUERY_STRING $query_string;
        
        # Headers de proxy para o Laravel saber que é HTTPS/Real IP
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        # Timeouts para scripts longos
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_connect_timeout 60s;
        
        # Desliga buffer para streaming ou uploads grandes
        fastcgi_request_buffering off;
        fastcgi_buffering off;
    }

    # (Opcional) Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }
}